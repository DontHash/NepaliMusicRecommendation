<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectR · Mood Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233b82f6' stroke-width='6'/%3E%3Cpath d='M16 3a13 13 0 0 1 11.3 6.6' fill='none' stroke='%2322c55e' stroke-width='6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three/three.module.js",
        "three/addons/": "/static/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">ProjectR<span>Mood Studio</span></div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search a song — title, artist, or lyric…" autocomplete="off" spellcheck="false" />
        <div id="results" class="results hidden"></div>
      </div>
      <button id="paste-toggle" class="ghost">Paste lyrics</button>
    </header>

    <main>
      <section id="stage">
        <canvas id="scene"></canvas>
        <div id="center-label">
          <div id="song-title">Search a song to begin</div>
          <div id="song-artist" class="artist"></div>
          <div id="mood-phrase"></div>
          <div id="confidence" class="chip hidden"></div>
        </div>
        <div id="tooltip" class="tooltip hidden"></div>
      </section>

      <aside id="lyrics-panel">
        <div class="panel-head">
          <h2 id="lyrics-title">Lyrics</h2>
          <div class="panel-actions">
            <button id="mood-mode" class="ghost small" title="soft: text colored by emotion strength">soft</button>
            <button id="clear-selection" class="ghost small hidden">clear</button>
          </div>
        </div>
        <div id="legend"></div>
        <div id="polarity" class="hidden">
          <div class="polarity-track"><div id="polarity-marker"></div></div>
          <div class="polarity-labels"><span>negative</span><span id="polarity-label">–</span><span>positive</span></div>
        </div>
        <div id="neighbors" class="neighbors hidden">
          <div class="neighbors-head">
            <h3 id="neighbors-title">Mood neighbours</h3>
            <div id="mood-chips">
              <button class="mood-chip" data-emotion="joy"><span class="dot" style="background:#22c55e"></span>joy</button>
              <button class="mood-chip" data-emotion="sadness"><span class="dot" style="background:#3b82f6"></span>sadness</button>
              <button class="mood-chip" data-emotion="anger"><span class="dot" style="background:#ef4444"></span>anger</button>
            </div>
          </div>
          <div id="neighbors-list" class="neighbors-list"></div>
        </div>
        <div id="lyrics" class="lyrics"></div>
      </aside>
    </main>

    <div id="paste-modal" class="modal hidden">
      <div class="modal-card">
        <h3>Analyze pasted lyrics</h3>
        <p class="hint">Devanagari or Romanized Nepali. Romanized text is transliterated when available.</p>
        <textarea id="paste-text" placeholder="Paste lyrics here…"></textarea>
        <div class="modal-actions">
          <button id="paste-cancel" class="ghost">Cancel</button>
          <button id="paste-run">Analyze</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loading-text">Loading…</span></div>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
