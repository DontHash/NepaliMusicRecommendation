name: audio-pipeline

on:
  push:
    paths:
      - "scripts/audio/**"
      - "tests/test_audio_pipeline.py"
      - ".github/workflows/audio-pipeline.yml"
  pull_request:
    paths:
      - "scripts/audio/**"
      - "tests/test_audio_pipeline.py"
      - ".github/workflows/audio-pipeline.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest numpy pandas rapidfuzz
      - name: Run hermetic audio pipeline tests
        run: python -m pytest tests/test_audio_pipeline.py -q
