name: data-contracts

on:
  push:
    paths:
      - "data_engineering/**"
      - "scripts/validate_datasets.py"
      - "scripts/build_artifact_manifest.py"
      - "scripts/verify_artifacts.py"
      - "tests/test_data_contracts.py"
      - "tests/test_artifact_manifest.py"
      - "music_rec_artifacts/**"
      - "CSVs Dataset/corpus_final_*.csv"
      - "R_data/audio/**"
      - ".github/workflows/data-contracts.yml"
  pull_request:
    paths:
      - "data_engineering/**"
      - "scripts/validate_datasets.py"
      - "scripts/build_artifact_manifest.py"
      - "scripts/verify_artifacts.py"
      - "tests/test_data_contracts.py"
      - "tests/test_artifact_manifest.py"
      - "music_rec_artifacts/**"
      - "CSVs Dataset/corpus_final_*.csv"
      - "R_data/audio/**"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pandas numpy
      - name: Contract and manifest tests
        run: python -m pytest tests/test_data_contracts.py tests/test_artifact_manifest.py -q
      - name: Validate committed production datasets
        run: python scripts/validate_datasets.py
      - name: Verify serving artifact manifest
        run: python scripts/verify_artifacts.py
